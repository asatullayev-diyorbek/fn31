<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>PuzzleTogether — birgalikda pazl yig'ish</title>
    <meta
      name="description"
      content="Telegram orqali kiring va do'stlaringiz bilan real vaqtda bitta pazlni birgalikda yig'ing."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("puzzletogether:theme");
          var theme = saved === "light" || saved === "dark" ? saved : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
